# Fails when a URL on the remote job boards page stops answering 200.
# Runs when the list changes, every Monday, and on demand.
name: Job board links

on:
  pull_request:
    paths:
      - src/content/job-board-list/**
      - scripts/check-links.mjs
      - .github/workflows/job-board-links.yml
  push:
    branches: [main]
    paths:
      - src/content/job-board-list/**
      - scripts/check-links.mjs
      - .github/workflows/job-board-links.yml
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check-links
