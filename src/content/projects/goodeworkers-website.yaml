description:
  en: |-
    The site you are on. Bilingual, built with Astro and Tailwind, shipped as open source on GitHub.
  fr: |-
    Le site sur lequel vous êtes. Bilingue, construit avec Astro et Tailwind, publié en open source sur GitHub.
why:
  en: |-
    The association needs a public face that says what it does, in two languages, without an agency budget. Building it ourselves was also the first proof that a remote team can ship something real, asynchronously, in the open.
  fr: |-
    L'association a besoin d'une vitrine qui dit ce qu'elle fait, en deux langues, sans budget d'agence. Le construire nous-mêmes était aussi la première preuve qu'une équipe à distance peut livrer quelque chose de réel, en asynchrone, en public.
