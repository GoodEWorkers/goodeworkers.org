about:
  en: |-
    Alice co-founded GoodEWorkers and leads its communication strategy.
    She has been a freelance SEO and GEO consultant since 2020. She works with SMEs, mid-sized companies and large accounts across the whole of organic search: technical, semantic and off-site, as well as their visibility in AI-generated answers. Her work is about turning search into a measurable, profitable acquisition channel.

    She has taught these disciplines at IAE Lyon since 2024, in the Master 2 Marketing Connecté et Communication Digitale programme.
  fr: |-
    Alice a co-fondé GoodEWorkers et dirige la stratégie de communication.
    Elle est freelance en SEO et GEO depuis 2020. Elle accompagne des PME, ETI et grands comptes sur l'ensemble du référencement naturel : technique, sémantique et off-site, ainsi que sur leur visibilité dans les réponses générées par les IA. Son travail consiste à transformer la recherche en canal d'acquisition mesurable et rentable.

    Elle enseigne ces disciplines à l'IAE de Lyon depuis 2024, au sein du Master 2 Marketing Connecté et Communication Digitale.
