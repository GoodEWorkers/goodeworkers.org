contributions:
  en: |-
    As president and director of publication, Alice also coordinates the volunteer team put together for each project under her scope: listening to the need, writing the brief, steering the work through to delivery.

    She is one of the two first contacts for nonprofits who write to GoodEWorkers.
  fr: |-
    Présidente et directrice de la publication, Alice coordonne également l'équipe de bénévoles constituée pour chaque projet placé sous son scope : écoute du besoin, cahier des charges, pilotage jusqu'à la livraison.

    Elle est l'un des deux premiers contacts des associations qui écrivent à GoodEWorkers.
