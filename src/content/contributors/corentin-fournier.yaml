about:
  en: |-
    Corentin is a freelance SEO and GEO consultant working with B2B companies of 10 to 100 employees, mostly alongside CMOs and Heads of Marketing.

    His goal is to turn a company's website into an autonomous, profitable acquisition system, through documented methodology and measurable results rather than tricks.

    Before going freelance, he worked in SEO agencies, where he saw exhaustive 50-recommendation audits end up with only a fraction of the actions ever implemented. That experience shaped his own backlog-first approach: audits delivered as prioritized tickets, with at least one ticket executable in 30 minutes during the first week. His focus is as much on producing recommendations aligned with the internal resources as it is on making sure the recommendations actually get implemented.
  fr: |-
    Corentin est consultant SEO et GEO freelance auprès d'entreprises B2B de 10 à 100 salariés, le plus souvent aux côtés des CMO et des responsables marketing.

    Son objectif est de faire du site d'une entreprise un système d'acquisition autonome et rentable, en s'appuyant sur une méthodologie documentée et des résultats mesurables plutôt que sur des astuces.

    Avant de se lancer en freelance, il a travaillé dans des agences SEO, où il a vu des audits exhaustifs de 50 recommandations dont seule une fraction des actions finissait par être mise en œuvre. Cette expérience a façonné son approche centrée sur le backlog : des audits livrés sous forme de tickets priorisés, dont au moins un réalisable en 30 minutes dès la première semaine. Il s'attache autant à produire des recommandations adaptées aux ressources internes qu'à s'assurer qu'elles sont effectivement appliquées.
