contributions:
  en: |-
    As a volunteer, Lili created the complete visual identity for GoodEWorkers. She also designed the website mockups, leveraging her design expertise to build a cohesive, user-friendly, and engaging digital environment for the organization.
  fr: |-
    Bénévole, Lili a créé l'intégralité de l'identité visuelle de GoodEWorkers. Elle a également conçu les maquettes du site, mettant son expertise du design au service d'un environnement numérique cohérent, intuitif et engageant pour l'association.
