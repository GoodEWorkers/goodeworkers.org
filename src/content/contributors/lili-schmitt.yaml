about:
  en: |-
    Lili is a freelance motion designer and graphic designer since 2018. She supports her clients across their entire visual communication strategy: brand identity, video animation, presentation materials, and merchandise creation. Fully proficient in the Adobe Creative Suite as well as Figma, her work is about turning raw concepts into dynamic, structured, and impactful visual experiences.
  fr: |-
    Lili est motion designer et graphiste freelance depuis 2018. Elle accompagne ses clients sur l'ensemble de leur stratégie de communication visuelle : identité de marque, animation vidéo, supports de présentation et création de goodies. Parfaitement à l'aise avec la suite Adobe Creative ainsi qu'avec Figma, son travail consiste à transformer des concepts bruts en expériences visuelles dynamiques, structurées et percutantes.
