contributions:
  en: |-
    As a volunteer, Kevin works on fhir-map, the association's open-source FHIR terminology and transformation server.

    He made HL7v2 transforms return ER7 message text instead of a JSON object, so an HPRIM message can be converted to HL7v2 and then to FHIR in two chained calls. He also documented how the server resolves StructureMaps and brought the project's dependencies and CI workflows up to date.
  fr: |-
    Bénévole, Kevin contribue à fhir-map, le serveur open source de terminologie et de transformation FHIR de l'association.

    Il a fait en sorte que les transformations HL7v2 renvoient un message texte ER7 plutôt qu'un objet JSON, ce qui permet de convertir un message HPRIM en HL7v2 puis en FHIR en deux appels enchaînés. Il a aussi documenté la façon dont le serveur résout les StructureMaps et mis à jour les dépendances et les workflows de CI du projet.
