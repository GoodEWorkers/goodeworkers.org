<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none" stroke-linecap="round" stroke-linejoin="round"><desc>Health and hospitals: a steady row of circles along a straight line, with one pulse-shaped rise. Set 05, circle packing, after The Book of 100 B027 (circles packed along a line). Structure: one beat at x 433, placed by the seed, drawn from its top; the line at y 275.2, where it lands. Process: equal circles, each touching the last, down both strokes (one more on the falling one, a dip under the line), then out along the line. Mark: ink rings; the top light, the rise spill. top 72; lean 15; up 3; down 4; x0 110; x1 690; at 0.5,0.6; r 24; gap 6; pen 4; groups 6. Seed gew05-health-3.</desc><g class="light"><path fill="var(--spill, #FDC959)" d="M382 119a24 24 0 1 0 48 0 24 24 0 1 0-48 0M368 171a24 24 0 1 0 48 0 24 24 0 1 0-48 0M354 223a24 24 0 1 0 48 0 24 24 0 1 0-48 0M436 119a24 24 0 1 0 48 0 24 24 0 1 0-48 0M450 171a24 24 0 1 0 48 0 24 24 0 1 0-48 0M464 223a24 24 0 1 0 48 0 24 24 0 1 0-48 0"/><path fill="var(--light, #F8F8F8)" d="M409 72a24 24 0 1 0 48 0 24 24 0 1 0-48 0"/></g><g class="frame" stroke="var(--ink, #111111)" stroke-width="4"><path pathLength="1" d="M124 275a24 24 0 1 0 48 0 24 24 0 1 0-48 0M178 275a24 24 0 1 0 48 0 24 24 0 1 0-48 0M232 275a24 24 0 1 0 48 0 24 24 0 1 0-48 0"/><path pathLength="1" d="M286 275a24 24 0 1 0 48 0 24 24 0 1 0-48 0M340 275a24 24 0 1 0 48 0 24 24 0 1 0-48 0M354 223a24 24 0 1 0 48 0 24 24 0 1 0-48 0"/><path pathLength="1" d="M368 171a24 24 0 1 0 48 0 24 24 0 1 0-48 0M382 119a24 24 0 1 0 48 0 24 24 0 1 0-48 0M409 72a24 24 0 1 0 48 0 24 24 0 1 0-48 0"/><path pathLength="1" d="M436 119a24 24 0 1 0 48 0 24 24 0 1 0-48 0M450 171a24 24 0 1 0 48 0 24 24 0 1 0-48 0M464 223a24 24 0 1 0 48 0 24 24 0 1 0-48 0"/><path pathLength="1" d="M478 275a24 24 0 1 0 48 0 24 24 0 1 0-48 0M492 327a24 24 0 1 0 48 0 24 24 0 1 0-48 0M532 275a24 24 0 1 0 48 0 24 24 0 1 0-48 0"/><path pathLength="1" d="M586 275a24 24 0 1 0 48 0 24 24 