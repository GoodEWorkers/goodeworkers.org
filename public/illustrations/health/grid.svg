<desc>Grid with growing disorder, one accent cell (illustrator 03). After B017 Irregular Census (Molnar/Nees grid, one red cell) and B067 Repetition with Fatigue (domain repetition, size by cell index (7i+3j) mod 9). Health and hospitals. 24x5 squares (an hour a column), pitch 30, side 20, no disorder but the top row (lifted 8): its squares step evenly along a heartbeat (P 0.32; R 5 pitches high on 1.5+1.5 columns, 5+3 squares; S -0.4; T 0.52), turned to the line, and rejoin their columns; the R peak is the accent, 1.6x, turned 45 deg into the spike's tip. Pen 3. Seed rng("03-health-and-hospitals").</desc>
