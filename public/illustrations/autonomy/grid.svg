<desc>Grid with growing disorder, one accent cell (illustrator 03). After B017 Irregular Census (Molnar/Nees grid, one red cell) and B067 Repetition with Fatigue (domain repetition, size by cell index (7i+3j) mod 9). Autonomy. 8x6 squares, pitch 32, side 22, no disorder; the cell at (5,1) leaves on a quadratic path in 3 equal steps, turning 15 deg and growing to 1.6x on the way; its slot stays open; the last step is the accent. Pen 3. Seed rng("03-autonomy").</desc>
