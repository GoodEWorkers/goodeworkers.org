<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" class="illo-live"><desc>Living mosaic: autonomy. Each row in turn gathers into one lit bar and lets go into three tiles of their own; for one beat no bar holds anyone. After the draft valeurs-animation.html; 8 s loop, SMIL, rests on the composed mosaic.</desc><rect x="94" y="44" width="64" height="64" rx="12" fill="var(--spill, #B3A0CF)" fill-opacity="0.65"/><rect x="168" y="44" width="64" height="64" rx="12" fill="var(--spill, #B3A0CF)" fill-opacity="0.65"/><rect x="242" y="44" width="64" height="64" rx="12" fill="var(--spill, #B3A0CF)" fill-opacity="0.65"/><rect x="94" y="118" width="64" height="64" rx="12" fill="var(--spill, #B3A0CF)" fill-opacity="0.65"/><rect x="168" y="118" width="64" height="64" rx="12" fill="var(--spill, #B3A0CF)" fill-opacity="0.65"/><rect x="242" y="118" width="64" height="64" rx="12" fill="var(--spill, #B3A0CF)" fill-opacity="0.65"/><rect x="94" y="192" width="64" height="64" rx="12" fill="var(--spill, #B3A0CF)" fill-opacity="0.65"/><rect x="168" y="192" width="64" height="64" rx="12" fill="var(--spill, #B3A0CF)" fill-opacity="0.65"/><rect x="242" y="192" width="64" height="64" rx="12" fill="var(--spill, #B3A0CF)" fill-opacity="0.65"/><rect x="94" y="44" width="212" height="64" rx="12" fill="var(--light, #F8F8F8)" fill-opacity="1"><animate attributeName="width" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.1;0.8;0.9;1" values="212;64;64;212;212" keySplines=".7 0 .3 1;0 0 1 1;.7 0 .3 1;0 0 1 1"/><animate attributeName="fill-opacity" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.1;0.2;0.8;0.8;1" values="1;1;0;0;1;1" keySplines="0 0 1 1;.45 0 .25 1;0 0 1 1;.45 0 .25 1;0 0 1 1"/></rect><rect x="94" y="118" width="64" height="64" rx="12" fill="var(--light, #F8F8F8)" fill-opacity="0"><animate attributeName="width" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0;0.2;0.3;0.4;1" values="64;64;212;212;64;64" keySplines