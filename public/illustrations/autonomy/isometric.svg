<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke-linecap="round" stroke-linejoin="round"><desc>Isometric partitions and hex clusters: autonomy. An even field of identical cubes; one, at the back corner, rises three cubes high on the same grid, its top lit. After B015 Isometric Allotment (partition, hashed heights, painter's order), B018 Hex Terraces (roots reserve neighbours), B068 Soft Brutalism (flat three-tone light), B098 Terraced Reaction. Structure: one module, identical cubes on one grid with one gap. Process: whole cubes stacked, painted back to front by x+y+z on a (7,4) (-7,4) (0,-8) lattice. Mark: paper on the subject's top, the value's colour on every lit face, ground through the shade face, 3-unit ink where faces meet. Params {C:4,G:2,n:4,tall:3}. Seed rng("GEW06-autonomy-m").</desc><g class="light"><path fill="var(--spill, #B3A0CF)" d="M200 126l-14 8v-16l-14-8v-80l28 16zM214 118l28 16v16l-14 8v-16l-14-8zM158 134v16l-14 8v-16l-14-8v-16zM172 142l28 16v16l-14 8v-16l-14-8zM256 142l28 16v16l-14 8v-16l-14-8zM116 158v16l-14 8v-16l-14-8v-16zM130 166l28 16v16l-14 8v-16l-14-8zM214 166l28 16v16l-14 8v-16l-14-8zM298 166l28 16v32l-14-8v-16l-14-8zM74 182v32l-28-16v-32zM88 190l28 16v32l-28-16zM172 190l28 16v16l-14 8v-16l-14-8zM256 190l28 16v32l-14-8v-16l-14-8zM130 214l28 16v32l-28-16zM214 214l28 16v32l-14-8v-16l-14-8zM172 238l28 16v32l-28-16z"/><path fill="var(--light, #F8F8F8)" d="M200 46l-28-16l28-16l28 16z"/></g><g class="frame" stroke="var(--ink, #111111)" stroke-width="3"><path pathLength="1" d="M172 94l28 16l28-16M172 62l28 16l28-16M46 198l28 16l14-8M354 198l-28 16l-14-8M88 222l28 16l14-8M312 222l-28 16l-14-8M130 246l28 16l14-8M270 246l-28 16l-14-8M172 270l28 16l28-16"/><path pathLength="1" d="M186 118v16M200 126v-80M214 118v16M172 110v-80M228 110v-80M158 134v16M242 134v16M144 142v16M172 142v16M228 142v16M256 142v16M130 134v-16M270 134v-16M116 158v16M200 158v16M284 158v16M102 166v16M130 166v16M186 166v16M214 166v16M270 166v16M298 