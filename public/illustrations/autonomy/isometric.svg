<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke-linecap="round" stroke-linejoin="round"><desc>Isometric partitions and hex clusters: autonomy. One block stands at its own height, apart from an even field but on its grid. After B015 Isometric Allotment (partition, hashed heights, painter's order), B018 Hex Terraces (roots reserve neighbours), B068 Soft Brutalism (flat three-tone light), B098 Terraced Reaction. Structure: ground plan. Process: hashed heights, painted back to front by x+y+z on a (7,4) (-7,4) (0,-8) lattice. Mark: paper on the subject's top, the value's colour on every lit face, ground through the shade face, 3-unit ink where faces meet. Params {n:4,f:5,p:6,hf:2,root:[3,0],hr:[10,12]}. Seed rng("GEW06-autonomy").</desc><g class="light"><path fill="var(--spill, #B3A0CF)" d="M200 94v8l-7 4v-8l-28-16v-8zM207 98l35 20v16l-7-4v-8l-28-16zM158 118v8l-7 4v-8l-28-16v-8zM165 122l35 20v8l-7 4v-8l-28-16zM116 142v8l-7 4v-8l-28-16v-8zM123 146l35 20v8l-7 4v-8l-28-16zM74 166v16l-35-20v-16zM81 170l35 20v16l-35-20zM165 170l35 20v8l-7 4v-8l-28-16zM123 194l35 20v16l-35-20zM207 194l35 20v16l-7-4v-8l-28-16zM165 218l35 20v16l-35-20z"/></g><g class="frame" stroke="var(--ink, #111111)" stroke-width="3"><path pathLength="1" d="M277 114l-35 20l-7-4M235 138l-28 16M39 162l35 20l7-4M81 186l35 20l7-4M123 210l35 20l7-4M277 210l-35 20l-7-4M165 234l35 20l35-20"/><path pathLength="1" d="M165 82v-8M235 74v8M200 102v-8M193 106v-8M207 106v-8M277 114v-16M123 106v-8M158 126v-8M242 118v16M151 130v-8M165 130v-8M235 122v16M81 130v-8M116 150v-8M200 150v-8M109 154v-8M123 154v-8M193 154v-8M39 162v-16M74 166v16M158 174v-8M81 170v16M151 178v-8M165 178v-8M235 170v8M116 190v16M200 198v-8M123 194v16M193 202v-8M207 202v-8M277 210v-16M158 214v16M242 214v16M165 218v16M235 218v16M200 238v16"/><path pathLength="1" d="M200 54l35 20l-35 20l-35-20zM158 78l-35 20l35 20l35-20zM207 98l35 20l35-20l-35-20zM200 102l-35 20l35 20l35-20zM116 102l-35 20l35 20l35-20zM158 126l-35 20l35 20l3