<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke-linecap="round" stroke-linejoin="round"><desc>Tiles: care. A mosaic of tiles; a tall tile in the light holds a round one at its foot, sheltered by the tall tile beside it. After the designer's Figma frame 4047-422: rounded tiles on one module (cell 64, gap 10, radius 12), quiet tint at 65%, one focal tile in the light with a shape cut out of it. Drawn by hand in code, no seed.</desc><path class="light" fill="var(--spill, #FD5E09)" fill-opacity=".65" d="M106 44H146A12 12 0 0 1 158 56V96A12 12 0 0 1 146 108H106A12 12 0 0 1 94 96V56A12 12 0 0 1 106 44ZM106 118H146A12 12 0 0 1 158 130V170A12 12 0 0 1 146 182H106A12 12 0 0 1 94 170V130A12 12 0 0 1 106 118ZM106 192H146A12 12 0 0 1 158 204V244A12 12 0 0 1 146 256H106A12 12 0 0 1 94 244V204A12 12 0 0 1 106 192ZM180 44H220A12 12 0 0 1 232 56V96A12 12 0 0 1 220 108H180A12 12 0 0 1 168 96V56A12 12 0 0 1 180 44ZM254 44H294A12 12 0 0 1 306 56V244A12 12 0 0 1 294 256H254A12 12 0 0 1 242 244V56A12 12 0 0 1 254 44Z"/><path fill="var(--light, #F8F8F8)" fill-rule="evenodd" d="M180 118H220A12 12 0 0 1 232 130V244A12 12 0 0 1 220 256H180A12 12 0 0 1 168 244V130A12 12 0 0 1 180 118ZM180 224A20 20 0 1 0 220 224A20 20 0 1 0 180 224Z"/></svg>
