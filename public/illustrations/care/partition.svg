<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none"><desc>GoodEWorkers, care. Recursive partition in flat colour, after Book of 100 plates B012, B011, B019, B092. Structure: frame and composition cuts; process: recursive bisection at 0.3-0.7; mark: one rule per cut, 4 / 3.5 / 3 / 2.5 / 2 by depth, flat fills. Parameters: core carved by a pinwheel of cuts at x 176, y 108, x 280, y 196; around it, a cell splits while its long side exceeds 30 + 3 x its distance to the core (depth 8, pieces of 13 or more); the cells touching the core in spill. Seed: rng("care-2"), book-core.js.</desc><g class="light" stroke="none"><path fill="var(--light, #F8F8F8)" d="M176 108h104v88h-104z"/><path fill="var(--spill, #FD5E09)" d="M159 108h17v30h-17zM159 138h17v15h-17zM141 153h35v27h-35zM161 180h15v26h-15zM176 84h21v24h-21zM197 84h33v24h-33zM230 85h25v23h-25zM255 81h19v27h-19zM280 108h21v18h-21zM280 126h20v40h-20zM280 166h29v35h-29zM176 196h22v20h-22zM198 196h26v14h-26zM224 196h29v32h-29zM253 196h27v15h-27z"/></g><g class="frame" stroke="var(--ink, #111111)" stroke-linecap="butt" stroke-linejoin="miter"><path stroke-width="4" pathLength="1" d="M20 20H380V280H20Z"/><path stroke-width="3.5" pathLength="1" d="M176 20V280"/><path stroke-width="3" pathLength="1" d="M176 108H380M20 153H176"/><path stroke-width="2.5" pathLength="1" d="M280 108V280M103 20V153M114 153V280M274 20V108"/><path stroke-width="2" pathLength="1" d="M176 196H280M103 81H176M129 81V153M129 108H176M143 81V108M157 81V108M159 108V153M159 138H176M114 229H176M114 206H176M141 153V206M141 180H176M161 180V206M148 206V229M230 20V108M176 49H230M176 84H230M197 84V108M230 66H274M255 66V108M230 85H255M255 81H274M338 20V108M274 71H338M315 71V108M280 166H380M350 108V166M323 108V166M280 126H323M301 108V126M300 126V166M280 201H380M327 166V201M309 166V201M344 201V280M280 234H344M306 201V234M224 196V280M176 236H224M198 196V236M176 216H198M198 210H224M224 228H280M253 196V228M253 211H280"/></g></svg>
