<desc>Grid with growing disorder, one accent cell (illustrator 03). After B017 Irregular Census (Molnar/Nees grid, one red cell) and B067 Repetition with Fatigue (domain repetition, size by cell index (7i+3j) mod 9). Care. 11x7 squares, pitch 32 far and 27 next to the centre cell (radius 7.5+integral of P-(P-27)exp(-r/2)); disorder d=smoothstep(1.2,5.5,r): turn 24d deg, jitter 4d, size x(1-0.3d(.5+.5fatigue)), relaxed; the centre cell is the accent, 1.6x. Pen 3. Seed rng("03-care").</desc>
