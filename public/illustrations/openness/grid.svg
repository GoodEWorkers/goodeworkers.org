<desc>Grid with growing disorder, one accent cell (illustrator 03). After B017 Irregular Census (Molnar/Nees grid, one red cell) and B067 Repetition with Fatigue (domain repetition, size by cell index (7i+3j) mod 9). Openness. 11x7 squares, pitch 32, side 22; a 5x3 window opens at the centre: its cells leave, the rim takes disorder d=1/0.42/0.14 by ring (turn 32d deg, push out 9d, size x(1-.25d*fatigue), relaxed); the cell that stays in the window is the accent, 1.6x. Pen 3. Seed rng("03-openness").</desc>
