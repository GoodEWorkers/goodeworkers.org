<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke-linecap="round" stroke-linejoin="round"><desc>Tiles: openness. A mosaic of tiles; the big one is a window in the light, a quarter sun rising from its corner, open to the room. After the designer's Figma frame 4047-422: rounded tiles on one module (cell 64, gap 10, radius 12), quiet tint at 65%, one focal tile in the light with a shape cut out of it. Drawn by hand in code, no seed.</desc><path class="light" fill="var(--spill, #FDC959)" fill-opacity=".65" d="M254 44H294A12 12 0 0 1 306 56V96A12 12 0 0 1 294 108H254A12 12 0 0 1 242 96V56A12 12 0 0 1 254 44ZM254 118H294A12 12 0 0 1 306 130V170A12 12 0 0 1 294 182H254A12 12 0 0 1 242 170V130A12 12 0 0 1 254 118ZM106 192H146A12 12 0 0 1 158 204V244A12 12 0 0 1 146 256H106A12 12 0 0 1 94 244V204A12 12 0 0 1 106 192ZM180 192H220A12 12 0 0 1 232 204V244A12 12 0 0 1 220 256H180A12 12 0 0 1 168 244V204A12 12 0 0 1 180 192ZM254 192H294A12 12 0 0 1 306 204V244A12 12 0 0 1 294 256H254A12 12 0 0 1 242 244V204A12 12 0 0 1 254 192Z"/><path fill="var(--light, #F8F8F8)" fill-rule="evenodd" d="M106 44H220A12 12 0 0 1 232 56V170A12 12 0 0 1 220 182H106A12 12 0 0 1 94 170V56A12 12 0 0 1 106 44ZM116 160V90A70 70 0 0 1 186 160Z"/></svg>
