<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke-linecap="round" stroke-linejoin="round"><desc>Isometric partitions and hex clusters: openness. An even field of identical cubes with one aisle left open through it, and the cube at its far end lit. After B015 Isometric Allotment (partition, hashed heights, painter's order), B018 Hex Terraces (roots reserve neighbours), B068 Soft Brutalism (flat three-tone light), B098 Terraced Reaction. Structure: one module, identical cubes on one grid with one gap. Process: whole cubes stacked, painted back to front by x+y+z on a (7,4) (-7,4) (0,-8) lattice. Mark: paper on the subject's top, the value's colour on every lit face, ground through the shade face, 3-unit ink where faces meet. Params {C:4,G:2,nx:5,ny:3,aisle:2}. Seed rng("GEW06-openness-m").</desc><g class="light"><path fill="var(--spill, #FDC959)" d="M158 78v16l-14 8v-16l-14-8v-16zM172 86l28 16v32l-14-8v-16l-14-8zM116 102v16l-14 8v-16l-14-8v-16zM130 110l28 16v32l-14-8v-16l-14-8zM214 110l28 16v16l-14 8l-14-8zM74 126v32l-28-16v-32zM88 134l28 16v32l-28-16zM256 134l28 16v16l-14 8v-16l-14-8zM298 158l28 16v32l-14-8v-16l-14-8zM242 174v16l-14 8v-16l-14-8v-16zM256 182l28 16v32l-14-8v-16l-14-8zM200 198v32l-28-16v-32zM214 206l28 16v32l-28-16z"/><path fill="var(--light, #F8F8F8)" d="M214 110l28-16l28 16l-28 16z"/></g><g class="frame" stroke="var(--ink, #111111)" stroke-width="3"><path pathLength="1" d="M186 126l14 8l14-8M46 142l28 16l14-8M186 142l-28 16l-14-8M214 142l14 8M88 166l28 16l28-16M354 190l-28 16l-14-8M172 214l28 16l14-8M312 214l-28 16l-14-8M214 238l28 16l28-16"/><path pathLength="1" d="M158 78v16M144 86v16M172 86v16M130 78v-16M186 78v-16M116 102v16M200 102v32M102 110v16M130 110v16M186 110v32M214 110v32M88 102v-16M228 102v-16M74 126v32M158 126v32M242 126v16M88 134v32M144 134v32M256 134v16M46 142v-32M270 126v-16M116 150v32M284 150v16M270 158v16M298 158v16M312 150v-16M242 174v16M326 174v32M228 182v16M256 182v16M312 182v32M354 190v-32M214 174v-1