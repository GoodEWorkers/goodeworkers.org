<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke="var(--ink, #111111)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<desc>Grid with growing disorder, one accent cell (illustrator 03). After B017 Irregular Census (Molnar/Nees grid, one red cell) and B067 Repetition with Fatigue (domain repetition, size by cell index (7i+3j) mod 9). Solidarity. 11x7 squares, pitch 32, side 22; the lattice makes room (7.6) for the cell (7,3); every square leans toward it by 0.9 x its angle off the vertical (clamp 45 deg), weighted w=max(0.4,exp(-(r-1.5)/3.5)), moves 4w toward it and tires to x(1-0.2w), relaxed (the nearer keeps its lean); that cell is the accent, 1.6x. Pen 3. Seed rng("03-solidarity").</desc>
