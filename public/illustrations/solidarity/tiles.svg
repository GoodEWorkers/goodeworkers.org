<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke-linecap="round" stroke-linejoin="round"><desc>Tiles: solidarity. Nine tiles in a square; the one at its centre is round and in the light, held by the eight around it. After the designer's Figma frame 4047-422: rounded tiles on one module (cell 64, gap 10, radius 12), quiet tint at 65%, one focal tile in the light with a shape cut out of it. Drawn by hand in code, no seed.</desc><path class="light" fill="var(--spill, #6667AB)" fill-opacity=".65" d="M106 44H146A12 12 0 0 1 158 56V96A12 12 0 0 1 146 108H106A12 12 0 0 1 94 96V56A12 12 0 0 1 106 44ZM180 44H220A12 12 0 0 1 232 56V96A12 12 0 0 1 220 108H180A12 12 0 0 1 168 96V56A12 12 0 0 1 180 44ZM254 44H294A12 12 0 0 1 306 56V96A12 12 0 0 1 294 108H254A12 12 0 0 1 242 96V56A12 12 0 0 1 254 44ZM106 118H146A12 12 0 0 1 158 130V170A12 12 0 0 1 146 182H106A12 12 0 0 1 94 170V130A12 12 0 0 1 106 118ZM254 118H294A12 12 0 0 1 306 130V170A12 12 0 0 1 294 182H254A12 12 0 0 1 242 170V130A12 12 0 0 1 254 118ZM106 192H146A12 12 0 0 1 158 204V244A12 12 0 0 1 146 256H106A12 12 0 0 1 94 244V204A12 12 0 0 1 106 192ZM180 192H220A12 12 0 0 1 232 204V244A12 12 0 0 1 220 256H180A12 12 0 0 1 168 244V204A12 12 0 0 1 180 192ZM254 192H294A12 12 0 0 1 306 204V244A12 12 0 0 1 294 256H254A12 12 0 0 1 242 244V204A12 12 0 0 1 254 192Z"/><path fill="var(--light, #F8F8F8)" fill-rule="evenodd" d="M168 150A32 32 0 1 0 232 150A32 32 0 1 0 168 150ZM188 150A12 12 0 1 0 212 150A12 12 0 1 0 188 150Z"/></svg>
