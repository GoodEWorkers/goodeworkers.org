<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke-linecap="round" stroke-linejoin="round"><desc>Isometric partitions and hex clusters: solidarity. Identical cubes in even rows, every top lit alike: none above the others, none left out. After B015 Isometric Allotment (partition, hashed heights, painter's order), B018 Hex Terraces (roots reserve neighbours), B068 Soft Brutalism (flat three-tone light), B098 Terraced Reaction. Structure: one module, identical cubes on one grid with one gap. Process: whole cubes stacked, painted back to front by x+y+z on a (7,4) (-7,4) (0,-8) lattice. Mark: paper on the subject's top, the value's colour on every lit face, ground through the shade face, 3-unit ink where faces meet. Params {C:4,G:2,nx:5,ny:3}. Seed rng("GEW06-solidarity-m").</desc><g class="light"><path fill="var(--spill, #6667AB)" d="M158 78v16l-14 8v-16l-14-8v-16zM172 86l28 16v16l-14 8v-16l-14-8zM116 102v16l-14 8v-16l-14-8v-16zM130 110l28 16v16l-14 8v-16l-14-8zM214 110l28 16v16l-14 8v-16l-14-8zM74 126v32l-28-16v-32zM88 134l28 16v32l-28-16zM172 134l28 16v16l-14 8v-16l-14-8zM256 134l28 16v16l-14 8v-16l-14-8zM130 158l28 16v32l-28-16zM214 158l28 16v16l-14 8v-16l-14-8zM298 158l28 16v32l-14-8v-16l-14-8zM172 182l28 16v32l-28-16zM256 182l28 16v32l-14-8v-16l-14-8zM214 206l28 16v32l-28-16z"/><path fill="var(--light, #F8F8F8)" d="M158 78l-28-16l28-16l28 16zM144 86l-28 16l-28-16l28-16zM172 86l28-16l28 16l-28 16zM158 94l28 16l-28 16l-28-16zM102 110l-28 16l-28-16l28-16zM214 110l28-16l28 16l-28 16zM116 118l28 16l-28 16l-28-16zM200 118l28 16l-28 16l-28-16zM256 134l28-16l28 16l-28 16zM158 142l28 16l-28 16l-28-16zM242 142l28 16l-28 16l-28-16zM298 158l28-16l28 16l-28 16zM200 166l28 16l-28 16l-28-16zM284 166l28 16l-28 16l-28-16zM242 190l28 16l-28 16l-28-16z"/></g><g class="frame" stroke="var(--ink, #111111)" stroke-width="3"><path pathLength="1" d="M46 142l28 16l14-8M88 166l28 16l14-8M130 190l28 16l14-8M354 190l-28 16l-14-8M172 214l28 16l14-8M312 214l-28 16l-