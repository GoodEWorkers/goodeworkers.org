[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Host-based 301 redirects: send every look-alike domain to https://goodeworkers.org
# force = true is required on every rule below -- without it Netlify will just
# serve the site's own content on that domain instead of redirecting, since the
# domain is already registered as a Netlify domain alias.
# Keep these above the path-only rules: Netlify applies the first match.

[[redirects]]
  from = "https://eworker.org/*"
  to = "https://goodeworkers.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://eworker.org/*"
  to = "https://goodeworkers.org/:splat"
  status = 301
  force = true

[[redirects]]
